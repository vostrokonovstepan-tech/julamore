# /etc/nginx/sites-available/julamore  →  ln -s в sites-enabled
# Счётчики запросов: по 10 заявок и 10 попыток входа в минуту с одного адреса.
# Эти две строки должны стоять вне server{} — в /etc/nginx/nginx.conf или здесь до него.
limit_req_zone $binary_remote_addr zone=julamore_lead:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=julamore_login:10m rate=10r/m;
# Замените julamore.ru на свой домен и путь /var/www/julamore — на папку с сайтом.
#
# После запуска certbot сам добавит блок для HTTPS и перенаправление с http.
# Чтобы сайт отвечал по одному адресу, в HTTPS-блоке стоит оставить такое правило:
#     if ($host = www.ваш-домен.ru) { return 301 https://ваш-домен.ru$request_uri; }
server {
    listen 80;
    server_name julamore.ru www.julamore.ru;

    root /var/www/julamore;
    index index.html;

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;          # сайт нельзя встроить в чужой фрейм
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS включать ТОЛЬКО после того, как HTTPS заработал:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;                                       # не показываем версию nginx

    # служебные папки сайта наружу не отдаём
    location ~ ^/(server|api|\.git) { deny all; return 404; }
    location ~ /\.                  { deny all; return 404; }

    # заявки → Node.js
    location = /api/send-lead {
        limit_req zone=julamore_lead burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    # страница со списком заявок → Node.js
    location = /api/admin/login {
        limit_req zone=julamore_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
    }
    location = /api/admin/leads {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # страница со списком заявок: закрыта от поисковиков на уровне сервера
    location = /leads.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # своя страница «не найдено»
    error_page 404 /404.html;
    location = /404.html { internal; }

    # картинки и видео кешируются браузером; css/js обновляются через ?v=
    # Внимание: add_header внутри location отменяет заголовки, заданные выше,
    # поэтому заголовок про тип файлов повторяем здесь.
    location ~* \.(jpg|jpeg|png|webp|svg|ico|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript text/javascript
               application/json image/svg+xml application/xml;
}

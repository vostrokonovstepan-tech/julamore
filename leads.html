<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Заявки — Julamore</title>
    <meta name="theme-color" content="#E29303">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <style>
        :root{
            --bg: #F6F1E7; --panel: #FFFFFF; --ink: #2A2420; --ink-dim: #6E6558;
            --gold: #E29303; --gold-pale: #B36B00; --line: rgba(226,147,3,.22);
        }
        *{ box-sizing: border-box; }
        body{
            margin:0; padding: 18px 16px 60px; background: var(--bg); color: var(--ink);
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px; line-height: 1.5;
        }
        .wrap{ max-width: 720px; margin: 0 auto; }
        h1{ font-size: 1.35rem; margin: 0 0 4px; }
        .sub{ color: var(--ink-dim); font-size: .9rem; margin: 0 0 22px; }

        input, button{ font: inherit; }
        input[type=password], input[type=search]{
            width: 100%; padding: 13px 14px; border: 1px solid var(--line);
            border-radius: 10px; background: var(--panel); color: var(--ink);
        }
        input:focus{ outline: 2px solid var(--gold); outline-offset: 1px; }
        button{
            padding: 13px 18px; border: 0; border-radius: 10px; background: var(--gold);
            color: #fff; font-weight: 600; cursor: pointer;
        }
        button.ghost{ background: transparent; color: var(--gold-pale); border: 1px solid var(--line); }
        button:disabled{ opacity: .6; cursor: default; }

        .row{ display: flex; gap: 10px; align-items: center; }
        .row > input{ flex: 1; }
        .bar{ display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .count{ color: var(--ink-dim); font-size: .88rem; margin-left: auto; }

        .card{
            background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
            padding: 16px 16px 14px; margin-bottom: 12px;
        }
        .card-top{ display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .name{ font-weight: 600; font-size: 1.05rem; }
        .time{ color: var(--ink-dim); font-size: .8rem; white-space: nowrap; }
        .contacts{ display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
        .contacts a{
            text-decoration: none; color: var(--gold-pale); border: 1px solid var(--line);
            border-radius: 999px; padding: 7px 14px; font-size: .92rem;
        }
        .contacts a:active{ background: rgba(226,147,3,.12); }
        .wish{ margin: 12px 0 0; white-space: pre-wrap; }
        .meta{ margin: 10px 0 0; color: var(--ink-dim); font-size: .78rem; }
        .empty, .error{ padding: 22px; text-align: center; color: var(--ink-dim); }
        .error{ color: #A33; }
        .demo-note{
            margin: 0 0 18px; padding: 12px 14px; border-left: 2px solid var(--gold);
            background: #EDE4D0; color: var(--ink); font-size: .85rem; line-height: 1.6;
        }
        [hidden]{ display: none !important; }
    </style>
    <script>
      // Сайт на GitHub Pages работает без сервера: форма и страница заявок
      // переходят в демо-режим. На своём сервере всё работает по-настоящему.
      window.JULAMORE_DEMO = /(^|\.)github\.io$/.test(location.hostname) || /[?&]demo=1/.test(location.search);
      // Демо-копию не пускаем в поисковики, чтобы она не конкурировала с будущим сайтом
      if (window.JULAMORE_DEMO) document.write('<meta name="robots" content="noindex, nofollow">');
    </script>
</head>
<body>
<div class="wrap">
    <h1>Заявки с сайта</h1>
    <p class="sub">Julamore — личный список обращений</p>

    <p class="demo-note" id="demoNote" hidden>
        Демонстрационная версия на GitHub Pages: сервера здесь нет, поэтому видны только заявки,
        отправленные с этого же устройства. На рабочем сервере список общий и хранится у вас.
    </p>

    <!-- вход -->
    <form id="loginForm" class="row" autocomplete="on">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">Войти</button>
    </form>
    <p class="error" id="loginError" hidden></p>

    <!-- список -->
    <div id="app" hidden>
        <div class="bar">
            <input type="search" id="search" placeholder="Поиск по имени, телефону, тексту" style="flex:1 1 220px;">
            <button class="ghost" id="refresh" type="button">Обновить</button>
            <button class="ghost" id="logout" type="button">Выйти</button>
            <span class="count" id="count"></span>
        </div>
        <div id="list"></div>
        <p class="empty" id="empty" hidden>Заявок пока нет.</p>
    </div>
</div>

<script>
(function () {
    const KEY = 'julamore-admin-token';
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const app = document.getElementById('app');
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');
    let leads = [];

    // Демо-режим (GitHub Pages): пароль проверяется прямо в браузере,
    // заявки берутся из localStorage этого устройства.
    const DEMO = !!window.JULAMORE_DEMO;
    const DEMO_PASSWORD = '1111';
    const DEMO_LEADS_KEY = 'julamore-demo-leads';
    if (DEMO) document.getElementById('demoNote').hidden = false;

    const store = {
        get() { try { return localStorage.getItem(KEY); } catch { return null; } },
        set(v) { try { localStorage.setItem(KEY, v); } catch {} },
        clear() { try { localStorage.removeItem(KEY); } catch {} },
    };

    function showError(text) {
        loginError.textContent = text;
        loginError.hidden = !text;
    }

    loginForm.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        showError('');
        try {
            if (DEMO) {
                if (document.getElementById('password').value !== DEMO_PASSWORD) throw new Error('Неверный пароль');
                store.set('demo');
                document.getElementById('password').value = '';
                enter();
                return;
            }
            const r = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value }),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'Не получилось войти');
            store.set(data.token);
            document.getElementById('password').value = '';
            enter();
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById('logout').addEventListener('click', () => {
        store.clear();
        app.hidden = true;
        loginForm.hidden = false;
    });
    document.getElementById('refresh').addEventListener('click', load);
    search.addEventListener('input', render);

    async function enter() {
        loginForm.hidden = true;
        app.hidden = false;
        await load();
    }

    async function load() {
        const btn = document.getElementById('refresh');
        btn.disabled = true;
        try {
            if (DEMO) {
                let saved = [];
                try { saved = JSON.parse(localStorage.getItem(DEMO_LEADS_KEY) || '[]'); } catch {}
                leads = saved.reverse();
                render();
                return;
            }
            const r = await fetch('/api/admin/leads', { headers: { 'X-Admin-Token': store.get() || '' } });
            if (r.status === 401) { store.clear(); app.hidden = true; loginForm.hidden = false; showError('Сессия закончилась, войдите снова'); return; }
            const data = await r.json();
            leads = data.leads || [];
            render();
        } catch {
            list.innerHTML = '<p class="error">Сервер не отвечает. Попробуйте обновить.</p>';
        } finally {
            btn.disabled = false;
        }
    }

    const fmt = iso => {
        const d = new Date(iso);
        return isNaN(d) ? '' : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    };
    const digits = s => String(s || '').replace(/[^\d+]/g, '');

    function render() {
        const q = search.value.trim().toLowerCase();
        const shown = q
            ? leads.filter(l => [l.firstName, l.lastName, l.phone, l.email, l.description].join(' ').toLowerCase().includes(q))
            : leads;

        list.replaceChildren(...shown.map(l => {
            const card = document.createElement('div');
            card.className = 'card';

            const top = document.createElement('div');
            top.className = 'card-top';
            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = [l.lastName, l.firstName].filter(Boolean).join(' ') || 'Без имени';
            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = fmt(l.time);
            top.append(name, time);

            const contacts = document.createElement('div');
            contacts.className = 'contacts';
            if (l.phone) {
                const a = document.createElement('a');
                a.href = 'tel:' + digits(l.phone);
                a.textContent = l.phone;
                contacts.appendChild(a);
            }
            if (l.email) {
                const a = document.createElement('a');
                a.href = 'mailto:' + l.email;
                a.textContent = l.email;
                contacts.appendChild(a);
            }

            card.append(top, contacts);

            if (l.description && l.description !== 'Не указано') {
                const wish = document.createElement('p');
                wish.className = 'wish';
                wish.textContent = l.description;
                card.appendChild(wish);
            }

            const meta = document.createElement('p');
            meta.className = 'meta';
            meta.textContent = [l.page ? 'страница ' + l.page : '', l.consent ? 'согласие получено' : 'без согласия'].filter(Boolean).join(' · ');
            card.appendChild(meta);

            return card;
        }));

        emptyEl.hidden = shown.length > 0;
        emptyEl.textContent = leads.length ? 'Ничего не нашлось.' : 'Заявок пока нет.';
        countEl.textContent = q ? `${shown.length} из ${leads.length}` : `Всего: ${leads.length}`;
    }

    if (store.get()) enter();
    setInterval(() => { if (!app.hidden) load(); }, 120000);
})();
</script>
</body>
</html>
